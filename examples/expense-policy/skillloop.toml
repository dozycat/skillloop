# A real (non-simulated) example: the agent and the framework LLM both run through the local
# `claude` CLI, so it needs no API key - only a working Claude Code login.
[project]
name = "expense-policy"
requirement = "requirement.md"
seed_skill = "seed_skill"
dataset = "dataset.jsonl"

[agent]
adapter = "llm"            # simplest agent: one model call with the skill as system prompt

[agent.options]
provider = "cli"
model = "haiku"

[llm]                      # the framework's own model: analysts, merger
provider = "cli"
model = "sonnet"

[eval]
judge = "numeric"          # compares the last number of the answer with `expected`
concurrency = 6
timeout_s = 180.0

[eval.judge_options]
abs_tol = 0.01

[evolve]
max_iterations = 4
candidates_per_iteration = 2
patience = 2
train_ratio = 0.5
val_ratio = 0.25
analyst_batch_size = 4
